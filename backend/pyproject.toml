[project]
name = "retro-watches-backend"
version = "0.1.0"
description = "Retro Watches backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.41",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.13",
    "python-multipart>=0.0.20",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI dependencies are function calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
